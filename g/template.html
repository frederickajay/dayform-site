<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://m38yf5f7va.execute-api.ap-southeast-2.amazonaws.com; base-uri 'none'; form-action 'none'">
<title>A gift for you · Dayform</title>
<!-- Generated by build.py from template.html, strings-new.json and the app's Localizable.xcstrings. Edit those, not index.html. -->
<style>
  :root { --bg:#FBF7F2; --card:#FFFFFF; --ink:#2B2238; --soft:#6E6478; --accent:#E0634F; --plum:#5B3A6B; --plum-ink:#FFFFFF; --line:#ECE4DA; --sunken:#F3ECE3; --wrap1:#5B3A6B; --wrap2:#E0634F; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17131C; --card:#221C29; --ink:#F6F0EA; --soft:#B9AFC2; --plum:#C9A7DB; --plum-ink:#1B1420; --line:#3A3242; --sunken:#1D1823; --wrap1:#3E2850; --wrap2:#B54A3A; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:520px; margin:0 auto; padding:28px 20px calc(40px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:22px; }
  .brand { font-weight:700; letter-spacing:-.02em; font-size:22px; }
  .brand span { color:var(--accent); }
  h1 { font-size:32px; line-height:1.15; letter-spacing:-.02em; margin:0; font-family:"Iowan Old Style",Georgia,serif; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:22px; display:flex; flex-direction:column; gap:14px; }
  .gift { border-radius:24px; padding:26px 22px; color:#fff; background:linear-gradient(140deg,var(--wrap1),var(--wrap2)); display:flex; flex-direction:column; gap:10px; min-height:180px; justify-content:flex-end; position:relative; overflow:hidden; }
  .gift::before { content:""; position:absolute; inset:0 auto 0 50%; width:18px; margin-inline-start:-9px; background:rgba(255,255,255,.18); }
  .gift .bow { position:absolute; top:18px; inset-inline-end:20px; font-size:40px; }
  .gift .to { font-size:15px; opacity:.85; margin:0; }
  .gift .title { font-family:"Iowan Old Style",Georgia,serif; font-size:26px; font-weight:600; margin:0; position:relative; }
  .gift .note { white-space:pre-line; overflow-wrap:anywhere; margin:0; font-size:17px; position:relative; }
  .muted { color:var(--soft); font-size:16px; margin:0; }
  .code { direction:ltr; unicode-bidi:isolate; text-align:center; font-size:22px; font-weight:700; letter-spacing:.06em; background:var(--sunken); border:1px solid var(--line); border-radius:16px; padding:12px 10px; overflow-wrap:anywhere; -webkit-user-select:all; user-select:all; }
  a.action, button.action { display:flex; align-items:center; justify-content:center; text-align:center; width:100%; min-height:58px; border-radius:18px; border:0; font:inherit; font-size:19px; font-weight:650; background:var(--plum); color:var(--plum-ink); cursor:pointer; text-decoration:none; padding:10px 16px; }
  button.action[disabled] { opacity:.6; cursor:default; }
  label.switch { display:flex; align-items:center; gap:12px; font-size:17px; cursor:pointer; }
  label.switch input { width:22px; height:22px; accent-color:var(--plum); flex:none; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">dayform<span> ✦</span></div>

  <div id="gift" class="gift hidden" aria-live="polite">
    <div class="bow" aria-hidden="true">🎁</div>
    <p id="to" class="to hidden"></p>
    <p id="title" class="title"></p>
    <p id="note" class="note hidden" dir="auto"></p>
  </div>

  <section id="open" class="hidden" style="display:flex;flex-direction:column;gap:18px">
    <h1 id="headline"></h1>
    <label class="switch"><input id="tell" type="checkbox" checked><span id="tellText"></span></label>
    <button id="go" class="action" type="button"></button>
    <p id="iphone" class="muted hidden"></p>
  </section>

  <section id="message" class="card hidden"><p id="messageText" style="margin:0"></p></section>

  <section id="ready" class="hidden" style="display:flex;flex-direction:column;gap:18px">
    <h1 id="readyTitle"></h1>
    <p id="readyText" class="muted"></p>
    <a id="redeem" class="action" rel="noopener"></a>
    <div id="code" class="code"></div>
  </section>

  <p id="privacy" class="muted"></p>
  <noscript><section class="card"><p class="muted">Open this link on your iPhone with JavaScript turned on, or open it in Dayform.</p></section></noscript>
</main>
<script>
(function () {
  'use strict';
  var API = 'https://m38yf5f7va.execute-api.ap-southeast-2.amazonaws.com';
  var APP_STORE_ID = '6834486675';
  var STR = /*STRINGS*/{};
  // ================================================================================================================
  var RTL = { ar: 1 };
  function pickLang() {
    var list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']);
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i] || '');
      if (/^zh/i.test(l)) return /(Hant|TW|HK|MO)/i.test(l) ? 'zh-Hant' : 'zh-Hans';
      if (/^pt/i.test(l)) return 'pt-BR';
      var base = l.split('-')[0].toLowerCase();
      if (STR.open[base]) return base;
    }
    return 'en';
  }
  var lang = pickLang();
  document.documentElement.lang = lang;
  if (RTL[lang]) document.documentElement.dir = 'rtl';
  function t(key, arg) {
    var e = STR[key] || {};
    var s = e[lang] || e.en || '';
    return arg === undefined ? s : s.replace('%@', arg);
  }
  function $(id) { return document.getElementById(id); }
  function show(id) { $(id).classList.remove('hidden'); }
  function hide(id) { $(id).classList.add('hidden'); }
  $('privacy').textContent = t('privacy');

  // The link: #<token>.<payload>; payload = base64url JSON {to, from, note, style}. Everything is shown with
  // textContent only: nothing from the link is ever treated as HTML.
  function clean(s, max) {
    s = typeof s === 'string' ? s.replace(/[\u0000-\u0009\u000B-\u001F\u007F‪-‮⁦-⁩]/g, '').trim() : '';
    return Array.from(s).slice(0, max).join('');
  }
  function readCard(p) {
    if (!p || !/^[A-Za-z0-9_-]+$/.test(p) || p.length > 1200) return null;
    try {
      var b = atob(p.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((p.length + 3) % 4));
      var bytes = new Uint8Array(b.length);
      for (var i = 0; i < b.length; i++) bytes[i] = b.charCodeAt(i);
      var j = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
      if (!j || typeof j !== 'object') return null;
      return { to: clean(j.to, 30), from: clean(j.from, 30), note: clean(j.note, 140) };
    } catch (e) { return null; }
  }
  var raw = location.hash.replace(/^#/, '');
  try { raw = decodeURIComponent(raw); } catch (e) {}
  var dot = raw.indexOf('.');
  var token = (dot < 0 ? raw : raw.slice(0, dot)).toLowerCase();
  var card = dot < 0 ? null : readCard(raw.slice(dot + 1));
  var from = card && card.from;

  $('title').textContent = from ? t('from', from) : t('forYou');
  if (card && card.to) { $('to').textContent = t('for', card.to); show('to'); }
  if (card && card.note) { $('note').textContent = card.note; show('note'); }
  show('gift');

  // retry: the gift is untouched (offline, busy, paused), so the button stays for another try.
  function message(text, retry) { if (!retry) hide('open'); hide('ready'); $('messageText').textContent = text; show('message'); }
  if (!/^[a-z2-7]{26}$/.test(token)) { message(t('broken')); return; }

  $('headline').textContent = t('year');
  $('tellText').textContent = from ? t('tell', from) : t('tellAny');
  $('go').textContent = t('open');
  show('open');

  var apple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!apple) { $('iphone').textContent = t('iphone'); show('iphone'); hide('go'); hide('tell'); $('tellText').parentNode.classList.add('hidden'); }

  function countdown(day) {
    // Opens when the day begins anywhere on Earth (00:00 UTC+14); the app also waits for local midnight.
    var p = String(day || '').split('-').map(Number);
    var at = Date.UTC(p[0], p[1] - 1, p[2]) - 14 * 3600 * 1000;
    var s = Math.max(60, (at - Date.now()) / 1000);
    function unit(n, u) { try { return new Intl.NumberFormat(lang, { style: 'unit', unit: u, unitDisplay: 'narrow' }).format(n); } catch (e) { return n + u.charAt(0); } }
    if (s > 86400) return unit(Math.floor(s / 86400), 'day') + ' ' + unit(Math.floor(s % 86400 / 3600), 'hour');
    return unit(Math.floor(s / 3600), 'hour') + ' ' + unit(Math.floor(s % 3600 / 60), 'minute');
  }

  var busy = false;
  $('go').addEventListener('click', function () {
    if (busy) return;
    busy = true; $('go').disabled = true; $('go').textContent = t('opening');
    var done = function () { busy = false; $('go').disabled = false; $('go').textContent = t('open'); };
    fetch(API + '/v1/gift/open', {
      method: 'POST', mode: 'cors', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ v: 1, token: token, usedOffers: [], tell: $('tell').checked })
    }).then(function (r) { return r.json().catch(function () { return {}; }); }).then(function (a) {
      done();
      var err = a && a.error && a.error.code;
      if (err === 'unknown_gift') return message(t('broken'));
      if (err === 'paused') return message(t('paused'), true);
      if (err) return message(t('unreachable'), true);
      switch (a.state) {
        case 'ready':
          if (!/^https:\/\/apps\.apple\.com\//.test(a.redeemUrl || '')) return message(t('unreachable'));
          hide('open');
          $('readyTitle').textContent = t('yours');
          $('readyText').textContent = t('installed');
          $('redeem').textContent = t('claim');
          $('redeem').href = a.redeemUrl;
          $('code').textContent = String(a.code || '');
          show('ready');
          location.href = a.redeemUrl;
          return;
        case 'not_yet': return message(t('waiting') + ' · ' + t('opensIn', countdown(a.opensOn)), true);
        case 'cancelled': return message(t('cancelled'));
        case 'expired': return message(t('expired'));
        case 'claimed': return message(t('claimed'));
        case 'later': return message(t('later'), true);
        case 'unavailable': return message(from ? t('usedTwo', from) : t('usedTwoAny'));
        default: return message(t('unreachable'));
      }
    }, function () { done(); message(t('offline'), true); });
  });

  // Safari's own banner: "Open" when Dayform is installed, and it hands this link to the app.
  var banner = document.createElement('meta');
  banner.name = 'apple-itunes-app';
  banner.content = 'app-id=' + APP_STORE_ID + ', app-argument=' + location.href;
  document.head.appendChild(banner);
})();
</script>
</body>
</html>
